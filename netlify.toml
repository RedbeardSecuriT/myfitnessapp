[build]
  command = "npm run build"
  publish = "dist"

# index.html must never be cached — it references hashed JS/CSS bundles
# All other assets can be cached forever (they're content-hashed)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
